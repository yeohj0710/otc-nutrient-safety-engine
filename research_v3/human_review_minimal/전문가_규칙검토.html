d that patients with diabetes developed OIPN at a lower cumulative oxaliplatin dose, although the severity of neuropathy was similar between those with and without diabetes. Although diabetic neuropathy and CIPN are distinct entities with independent pathogenic mechanisms, existing peripheral nerve injury from chronic hypergly", "signal_types": "neuropathy;neurotoxicity;toxicity;risk", "dose_mentions": ""}, {"pmid": "36367997", "section_title": "DISCUSSION", "locator": "PMC9928634, DISCUSSION, html-p39", "source_sha256": "a1aa7b65d1fa72bf4e6ca6986762fc6d6a17f70036cfd6868655811afb33dac6", "evidence_text": "The literature remains highly conflicted regarding what factors predispose patients to greater OIPN risk and severity. Increasing cumulative dose is the only characteristic that has consistently been correlated with greater chronic neurotoxicity.2-5 We similarly observed that patients randomly assigned to 12 treatments, relative to 6 treatments, were more likely to experience higher-grade neuropathy and longer times to resolution.", "signal_types": "neuropathy;neurotoxicity;toxicity;risk", "dose_mentions": ""}, {"pmid": "37207271", "section_title": "Assessment > Hazard characterisation > Selection of the critical effect and the reference point", "locator": "PMC10189633, Assessment > Hazard characterisation > Selection of the critical effect and the reference point, p230", "source_sha256": "fb6e35777f858f6fe4a52b278077a4b5809d1207073eea2bd1de125ec38b5529", "evidence_text": "A subchronic study in Beagle dogs (Phillips et al., 1978) allows the establishment of a LOAEL of 50 mg/kg bw per day. All Beagle dogs (n = 5) consuming this dose for around 100 days showed bilateral loss of myelin in the dorsal sensory nerve roots, but no symptoms of neurotoxicity.", "signal_types": "neurotoxicity;sensory;toxicity", "dose_mentions": "50 mg;200 mg"}, {"pmid": "40853095", "section_title": "Introduction", "locator": "PMC12376311, Introduction, p5", "source_sha256": "cbe2a5e17cce6061  elevated fibroblast growth factor 23 or TEAEs) was not apparent in this case or during up to one year of treatment with ERC in RCTs wherein serum 25D was maintained at concentrations averaging well above 50 ng/mL", "signal_types": "hypercalcemia;hypercalciuria;toxicity;safety;risk", "dose_mentions": "33 µg"}, {"pmid": "39300483", "section_title": "Methods/design > Safety procedures", "locator": "PMC11414195, Methods/design > Safety procedures, Par46", "source_sha256": "a112e5a52784340b7477c16e44ee7d18965bcc347899c1e24e40de0c39e0eff0", "evidence_text": "Participants are monitored for adverse events (AEs) from the time of intervention on a weekly basis during hospital admission (censored at 90 days) and through parent reporting at 28- and 90-day follow-ups. Specifically, in this trial, an AE is defined as any untoward medical occurrence that (1) is specified a priori as a safety endpoint (see below) or (2) is different from what is expected in the clinical course of the participant given their critical illness, co-morbidities, and related compli", "signal_types": "hypercalcemia;nephrolithiasis;toxicity;adverse event;safety", "dose_mentions": ""}, {"pmid": "24937025", "section_title": "Introduction", "locator": "PMC4209182, Introduction, html-p13", "source_sha256": "faf44f01ec2f70a1586e96f96ed7d0559496f31dbe7943eecf3278a04a19b1a9", "evidence_text": "Studies of toxicity after high calcium intake are rare. The RDA for calcium for older adults age 50–70 years is 1000–1200 mg/day and the recommended upper limit is 2,000mg/day (1).", "signal_types": "hypercalcemia;hypercalciuria;toxicity;adverse event", "dose_mentions": "1200 mg/day;2,000mg/day;2000 mg daily;1700mg daily"}, {"pmid": "38892507", "section_title": "4. Discussion", "locator": "PMC11174535, 4. Discussion, p36", "source_sha256": "91b798af07ad370c936adb4ffcdc5e17c0e2af948a4435314602f9f8d16596c1", "evidence_text": "In anticipation of these findings, changes in safety parameters, including serum 1,25(OH)2D, were analyzed throughout the study period. Serum 25-hydroxyvitamin D concentrations above 375 nmol/L (>150 ng/mL) would indicate Vitamin D overdosing and a high risk of hypercalcemia [42].", "signal_types": "hypercalcemia;adverse effect;safety;risk", "dose_mentions": "10,000 IU"}, {"pmid": "24937025", "section_title": "Discussion", "locator": "PMC4209182, Discussion, html-p62", "source_sha256": "faf44f01ec2f70a1586e96f96ed7d0559496f31dbe7943eecf3278a04a19b1a9", "evidence_text": "Healthcare practitioners who advise women on osteoporosis prevention seldom consider the issue of hypercalcemia and hypercalciuria by testing serum and urine calcium on an ongoing basis. It is known that 5–8% of men and women have idiopathic hypercalciuria which is a risk factor for kidney stones and one would expect that millions of men and women who take calcium supplements are in this risk group.", "signal_types": "hypercalcemia;hypercalciuria;kidney stone;risk", "dose_mentions": ""}, {"pmid": "24937025", "section_title": "Introduction", "locator": "PMC4209182, Introduction, html-p11", "source_sha256": "faf44f01ec2f70a1586e96f96ed7d0559496f31dbe7943eecf3278a04a19b1a9", "evidence_text": "There have been many trials of the effect of vitamin D and calcium on bone but no systematic study of potential adverse events such as hypercalcemia, hypercalciuria and kidney stones (1).", "signal_types": "hypercalcemia;hypercalciuria;kidney stone;adverse event", "dose_mentions": ""}, {"pmid": "24937025", "section_title": "Discussion", "locator": "PMC4209182, Discussion, html-p50", "source_sha256": "faf44f01ec2f70a1586e96f96ed7d0559496f31dbe7943eecf3278a04a19b1a9", "evidence_text": "No relationship was found between episodes of hypercalcemia and hypercalciuria and either the vitamin D3 dose or serum 25OHD but 24h urine calcium was weakly related to the 12-month serum 25OHD level. The women that develop hypercalciuria appear to be different from those that develop hypercalcemia as shown in Figure 4 but we found no difference in any variables that explained this finding.", "signal_types": "hypercalcemia;hypercalciuria;risk", "dose_mentions": "600 mg;400mg;300mg"}, {"pmid": "38787821", "section_title": "4 Discussion", "locator": "PMC11125479, 4 Discussion, p14", "source_sha256": "6c652a12d3b8af25416468c8c451f195b08ea68d310c5b1acb9905295b4b04c9", "evidence_text": "This meta-analysis included 12 RCTs involving 43118 participants and provided an overview of the efficacy and safety of vitamin D supplementation in preventing ARIs in older adults. For safety outcomes, the use of vitamin D supplements has no significant difference in death due to any cause, any adverse event, hypercalcinemia, and kidney stones.", "signal_types": "kidney stone;adverse event;safety;risk", "dose_mentions": ""}, {"pmid": "40083990", "section_title": "Discussion", "locator": "PMC11903805, Discussion, p0350", "source_sha256": "33d3edb9423b1a73bd92cc1bd75d1da5fdf437a2ab462b83f8a1010cdc851930", "evidence_text": "Hence, it can be concluded that DiabetEaze powder had no adverse effects on kidney and liver function. Liver function tests, such as AST, ALT, and bilirubin levels, were used to evaluate hepatic health and potential hepatotoxicity from the intervention.", "signal_types": "toxicity;adverse effect;safety;risk", "dose_mentions": ""}, {"pmid": "40551736", "section_title": "Human health > Bone health > Osteoporosis management", "locator": "PMC12183072, Human health > Bone health > Osteoporosis management, p23", "source_sha256": "521950060962b31b12f7bc9d579c0495229253139f161d6afcd4524dfd6b9d0d", "evidence_text": "Despite its benefits, excessive vitamin D intake poses risks, particularly the development of hypercalcemia—a condition marked by elevated serum calcium levels. Symptoms include nausea, vomiting, muscle weakness, polyuria, and in severe cases, renal impairment or nephrolithiasis (26).", "signal_types": "hypercalcemia;nephrolithiasis;toxicity;risk", "dose_mentions": ""}]}], "prefilled_decisions":
